name: CI

# Runs on every PR into main, and on main itself so the default branch is
# always known-good. These three jobs are what branch protection requires.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Kept in step with .nvmrc so CI and your laptop run the same Node.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails if the
      # lockfile is out of sync with package.json -- unlike `npm install`, which
      # would quietly "fix" it and hide the drift.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci
