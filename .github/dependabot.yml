version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Expo SDK packages must move together as a set -- bumping one in isolation
    # breaks the build. Those are upgraded via `npx expo install --fix` instead.
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: 'react-native'
      - dependency-name: '@expo/*'
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
